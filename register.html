
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account | JPM BANK & Co.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #fff;
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 28px;
      border-radius: 16px;
      background: #1d293b;
    }
    h1 { text-align: center; font-size: 26px; }
    p { color: #cbd5e1; line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #526174;
      border-radius: 8px;
      background: #101827;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    a { color: #93c5fd; }
    .message { overflow-wrap: anywhere; }
    .links { text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>JPM BANK & Co.</h1>
    <p>Create your account to submit requests and exchange messages.</p>

    <form id="registerForm">
      <label for="fullName">Full Name</label>
      <input id="fullName" type="text" autocomplete="name"
        maxlength="120" required>

      <label for="email">Email Address</label>
      <input id="email" type="email" autocomplete="email"
        maxlength="254" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password"
        minlength="8" required>
      <p>Use at least 8 characters.</p>

      <button id="submitButton" type="submit">Create Account</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <div class="links">
      <p>Already have an account? <a href="login.html">Log In</a></p>
      <p><a href="index.html">Back to Website</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://jtzmvjwtmpndwokpiugs.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_DV5yVeijQ7dfGxT7RFb4Ag_7NMTS-UZ";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullName =
        document.getElementById("fullName").value.trim();
      const email =
        document.getElementById("email").value.trim();
      const password =
        document.getElementById("password").value;

      if (!fullName || !email || password.length < 8) {
        message.textContent = "Please check the information you entered.";
        return;
      }

      button.disabled = true;
      message.textContent = "Creating your account…";

      try {
        const { data, error } = await client.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { full_name: fullName },
            emailRedirectTo: "https://jpm-bank-co.github.io/login.html"
          }
        });

        if (error) throw error;

        if (data.session) {
          message.textContent =
            "Account created. You are now signed in.";
        } else {
          message.textContent =
            "Registration submitted. Check your email to confirm your account before logging in.";
        }

        form.reset();
      } catch (error) {
        message.textContent =
          "Registration failed. Please check your information or try again later.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
  </html>
