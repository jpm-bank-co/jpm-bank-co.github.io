
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | JPM BANK & Co.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #fff;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 16px;
      background: #1d293b;
    }
    h1 { text-align: center; font-size: 26px; }
    p { color: #cbd5e1; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #526174;
      border-radius: 8px;
      background: #101827;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    a { color: #93c5fd; }
    .message { overflow-wrap: anywhere; }
    .links { text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>JPM BANK & Co.</h1>
    <p>Connectez-vous à votre compte pour accéder à vos demandes et messages.</p>

    <form id="loginForm">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Mot de passe</label>
      <input id="password" type="password"
        autocomplete="current-password" required minlength="6">

      <button type="submit">Se connecter</button>
    </form>

    <p id="message" class="message" role="status"></p>

    <div class="links">
      <p><a href="register.html">Créer un compte</a></p>
      <p><a href="index.html">Retour au site</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://jtzmvjwtmpndwokpiugs.supabase.co";
    const SUPABASE_ANON_KEY =
      "sb_publishable_DV5yVeijQ7dfGxT7RFb4Ag_7NMTS-UZ";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      message.textContent = "Connexion en cours…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent =
          "Connexion impossible. Vérifiez vos identifiants ou créez un compte.";
        return;
      }

      window.location.href = "index.html";
    });
  </script>
</body>
  </html>
